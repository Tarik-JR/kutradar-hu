<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
<title id="title">How KútRadar works</title><desc id="desc">Choose a location and fuel, compare fictional stations, and explore the map or save favourites. All station prices shown are simulated.</desc>
<rect width="1200" height="630" rx="30" fill="#f3f5f8"/>
<g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif">
<rect x="44" y="38" width="38" height="38" rx="12" fill="#087aff"/><path d="M54 48h12v18H54z M56 53h8 M66 53h3v8a3 3 0 0 1-3 3" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="96" y="63" font-size="22" font-weight="700" fill="#162332">KútRadar HU</text>
<rect x="944" y="40" width="210" height="34" rx="17" fill="#fff4de"/><circle cx="965" cy="57" r="4" fill="#dc8d0d"/><text x="980" y="62" font-size="13" font-weight="700" fill="#845a14">SIMULATED DATA</text>
<text x="44" y="142" font-size="43" font-weight="750" letter-spacing="-1.5" fill="#162332">Find a better fuel stop.</text>
<text x="45" y="174" font-size="17" fill="#667587">Choose where you are, compare options, and explore the map.</text>
<g transform="translate(44 210)"><rect width="350" height="336" rx="24" fill="#fff"/><rect x="22" y="22" width="38" height="38" rx="13" fill="#eaf3ff"/><text x="34" y="48" font-size="18" font-weight="700" fill="#087aff">1</text><text x="22" y="91" font-size="22" font-weight="700" fill="#162332">Set your search</text><text x="22" y="118" font-size="14" fill="#728093">Choose a city, fuel and radius.</text><rect x="22" y="145" width="306" height="53" rx="13" fill="#f2f3f7"/><text x="40" y="166" font-size="11" fill="#728093">CITY</text><text x="40" y="187" font-size="16" font-weight="650" fill="#172331">Budapest</text><path d="m302 168 6 6 6-6" fill="none" stroke="#8c98a5" stroke-width="2"/><rect x="22" y="211" width="306" height="44" rx="12" fill="#e9edf2"/><rect x="27" y="216" width="145" height="34" rx="9" fill="#fff"/><text x="52" y="238" font-size="13" font-weight="700" fill="#162332">Petrol 95</text><text x="220" y="238" font-size="13" fill="#647386">Diesel</text><text x="44" y="296" font-size="13" fill="#7b8796">Optional: use your location</text><circle cx="30" cy="292" r="4" fill="#087aff"/></g>
<g transform="translate(425 210)"><rect width="350" height="336" rx="24" fill="#fff"/><rect x="22" y="22" width="38" height="38" rx="13" fill="#eaf3ff"/><text x="34" y="48" font-size="18" font-weight="700" fill="#087aff">2</text><text x="22" y="91" font-size="22" font-weight="700" fill="#162332">Compare stations</text><text x="22" y="118" font-size="14" fill="#728093">Sort by price, distance or trip cost.</text><rect x="22" y="145" width="306" height="133" rx="16" fill="#f6f7f9"/><rect x="38" y="161" width="83" height="24" rx="8" fill="#e4efff"/><text x="49" y="177" font-size="11" font-weight="700" fill="#2869bd">EXAMPLE</text><text x="39" y="209" font-size="15" font-weight="700" fill="#172331">Station A</text><text x="39" y="231" font-size="13" fill="#728093">2.2 km away</text><text x="220" y="209" font-size="22" font-weight="750" fill="#087aff">543</text><text x="266" y="209" font-size="12" fill="#728093">Ft/L</text><path d="M38 246h272" stroke="#e1e5ea"/><text x="39" y="266" font-size="12" fill="#728093">Estimated fill-up cost</text><text x="247" y="266" font-size="12" font-weight="700" fill="#172331">21 720 Ft</text><text x="23" y="309" font-size="13" fill="#7b8796">Prices shown are examples</text></g>
<g transform="translate(806 210)"><rect width="350" height="336" rx="24" fill="#fff"/><rect x="22" y="22" width="38" height="38" rx="13" fill="#eaf3ff"/><text x="34" y="48" font-size="18" font-weight="700" fill="#087aff">3</text><text x="22" y="91" font-size="22" font-weight="700" fill="#162332">Explore and save</text><text x="22" y="118" font-size="14" fill="#728093">Open the map or save favourites.</text><rect x="22" y="145" width="306" height="145" rx="16" fill="#e7f0e8"/><path d="M22 185 328 260 M30 290 251 145 M82 145 210 290 M22 250 328 180" stroke="#fff" stroke-width="8" opacity=".8"/><path d="M22 222 328 222" stroke="#cfdee0" stroke-width="3"/><g transform="translate(131 170)"><path d="M19 48s-16-16-16-27a16 16 0 1 1 32 0C35 32 19 48 19 48Z" fill="#087aff" stroke="#fff" stroke-width="3"/><circle cx="19" cy="21" r="5" fill="#fff"/></g><circle cx="244" cy="257" r="18" fill="#fff"/><text x="235" y="264" font-size="22" fill="#087aff">♡</text><text x="23" y="314" font-size="13" fill="#7b8796">Illustrative map and stations</text></g>
<text x="45" y="590" font-size="14" fill="#667587">Demo only · No live fuel prices or real station locations</text><text x="1154" y="590" text-anchor="end" font-size="14" font-weight="650" fill="#087aff">KÚTRADAR HU / DEMO</text>
</g></svg>
